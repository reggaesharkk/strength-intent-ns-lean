name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Run input-boundary tests
        run: python -m unittest test_input_validation.py
      - name: Run deterministic toy replay
        run: python test_pipeline_reproducibility.py

